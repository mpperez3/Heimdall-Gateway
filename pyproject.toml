[project]
name = "heimdall-gateway"
version = "0.1.0"
description = "Heimdall Gateway: local inference gateway and model orchestration layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hf-transfer>=0.1.9",
    "huggingface-hub>=0.31.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "optuna>=4.0.0",
]

[project.scripts]
heimdall-gateway = "llamacpp_stack.llamacpp_api_install:main"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llamacpp_stack", "llamacpp_stack.bundle"]

[tool.setuptools.package-data]
"llamacpp_stack.bundle" = ["*.sh", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
