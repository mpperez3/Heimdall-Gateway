# llamacpp-superserver config.yaml
# Purpose: llama-swap routing and per-model command map generated from catalog.
# This file is regenerated by install/update operations.
# Example:
#   models:
#     my-model-id:
#       cmd: /opt/llama-server --model /models/my.gguf --ctx-size 65536
#       checkEndpoint: /health
#       ttl: 300

healthCheckTimeout: 600
logLevel: info
logToStdout: proxy
startPort: 18080
sendLoadingState: true
includeAliasesInList: true
models:
  repo-q4:
    cmd: /usr/bin/env CUDA_VISIBLE_DEVICES=0,1 /usr/bin/false --port ${PORT} --model
      /tmp/model.gguf --n-gpu-layers 999 --tensor-split 1,1 --host 127.0.0.1 -fit
      on -fitt 1024 -fitc 8192 --device CUDA0,CUDA1 --jinja
    checkEndpoint: /health
    ttl: 10
    aliases:
    - public-alias
  repo-q4__replica_0:
    cmd: /usr/bin/env CUDA_VISIBLE_DEVICES=0,1 /usr/bin/false --port ${PORT} --model
      /tmp/model.gguf --n-gpu-layers 999 --tensor-split 1,1 --host 127.0.0.1 --main-gpu
      0 -fit on -fitt 1024 -fitc 8192 --device CUDA0,CUDA1 --jinja
    checkEndpoint: /health
    ttl: 10
    metadata:
      internal_replica_of: repo-q4
    description: internal replica 0 of repo-q4
matrix:
  sets:
    group_0:
    - repo-q4
    group_1:
    - repo-q4__replica_0
  evict_costs:
    repo-q4: 10240
    repo-q4__replica_0: 10240
