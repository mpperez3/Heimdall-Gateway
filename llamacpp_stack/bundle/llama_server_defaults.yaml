# Editable defaults for heimdall-gateway installs.
#
# The installer copies this file to the config directory on first install as
# `llama_server_defaults.yaml`. Edit the copied file to change the defaults
# used when `llama_server_defaults` is empty in the active server config.
#
# The installer picks a preset by detected GPU count. If a matching preset is
# not found, the `default` block is used.

default:
  # Dynamic policy: Heimdall computes half of the model context per request
  # and clamps it to the request/server generation budget. llama-server is
  # launched with --reasoning-budget -1 so thinking_budget_tokens can be sent
  # through the OpenAI-compatible request without rebuilding the process.
  reasoning_budget: half_context
  keep: 20000
  cache_ram: 32768
  cache_type_k: f16
  cache_type_v: f16
  # Explicitly enable llama.cpp prompt/KV prefix reuse. OpenAI clients do not
  # consistently send this request option, so it must be a server default.
  cache_prompt: true
  ctx_checkpoints: 32
  checkpoint_min_step: 1024
  top_k: 20
  top_p: 0.95
  min_p: 0.0
  repeat_penalty: 1.0
  presence_penalty: 0.0
  batch_size: 4096
  ubatch_size: 2048
  threads: 16
  threads_batch: 8
  numa: distribute
  flash_attn: true
  n_gpu_layers: -1
  parallel: 1
  use_fitc: false
  swa_full: true

family_defaults:
  qwen:
    predict: 16384
    reasoning: "on"
    reasoning_budget_message: "Okay, I have thought enough. I will now provide the final answer"
    chat_template_kwargs:
      preserve_thinking: false


presets:
  "1":
    # Single GPU placement
    tensor_split: "1"

  "2":
    # Dual GPU placement
    tensor_split: "1,1"

  "4":
    # Quad GPU placement
    tensor_split: "1,1,1,1"

  "7":
    # 7+ GPU placement
    tensor_split: "1,1,1,1,1,1,1"

speculative_defaults:
  # Global defaults for speculative/draft model variants.
  # Set `enabled` to true to enable installer/CLI creation of speculative entries.
  enabled: false
  # Prefix used when generating speculative model catalog IDs: "speculative-<base_id>"
  id_prefix: speculative-
  # Flags applied to speculative model server runs when autocontext is not available.
  # `fit` is emitted as a string to match existing flag style (on/off).
  fit: on
  # `fitt` default value (integer tokens) when `fit` is used.
  fitt: 1024
  # Allow multiple speculative variants per base model when true.
  allow_multiple_variants: true

# Defaults for MTP (multi-token prediction) drafter-equipped models.
# Applied to the main model when an MTP drafter file is detected.
# Can be overridden per-model via server_overrides in the catalog.
mtp_defaults:
  image_min_tokens: 1024
  spec_draft_n_max: 3
  spec_draft_n_min: 0
  spec_draft_p_min: 0.75

# vLLM defaults are kept separate from llama.cpp flags. They are applied only
# to catalog entries whose backend is `vllm`.
vllm:
  defaults: {}
  family_defaults:
    qwen3.6:
      # Same serving intent as the Qwen3.6 GGUF profile below: one scheduled
      # sequence, a 1024-token scheduler batch, BF16 compute, and the native
      # Qwen thinking/template path. These are vLLM options, not llama.cpp
      # flags; model-specific options remain inside this vllm object.
      max_model_len: 262144
      dtype: bfloat16
      trust_remote_code: true
      # vLLM reserves scheduler slots for the three-token MTP proposer.
      # 1024 (the llama.cpp batch size) triggers a scheduler warning here;
      # 8192 leaves scheduler headroom for the speculative slots while
      # max_num_seqs keeps the latency-oriented single-sequence profile.
      max_num_batched_tokens: 8192
      max_num_seqs: 1
      disable_custom_all_reduce: true
      reasoning_parser: qwen3
      default_chat_template_kwargs:
        enable_thinking: true
      generation_config: vllm
      override_generation_config:
        top_k: 20
        top_p: 0.95
        repetition_penalty: 1.0
        presence_penalty: 0.0
        max_new_tokens: 16384
      speculative_config:
        method: mtp
        num_speculative_tokens: 3
