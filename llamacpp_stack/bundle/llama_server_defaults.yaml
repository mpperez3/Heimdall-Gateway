# Editable defaults for llamacpp-superserver installs.
#
# The installer copies this file to the config directory on first install as
# `llama_server_defaults.yaml`. Edit the copied file to change the defaults
# used when `llama_server_defaults` is empty in the active server config.
#
# The installer picks a preset by detected GPU count. If a matching preset is
# not found, the `default` block is used.

default:
  keep: 1024
  mirostat: 2
  mirostat_ent: 4.5
  mirostat_lr: 0.1
  cache_type_k: q8_0
  cache_type_v: q8_0
  flash_attn: on
  mul_mat_q: true


presets:
  "1":
    # Single GPU: smaller batches, conservative memory
    tensor_split: "1"
    batch_size: 512
    ubatch_size: 256
    threads: 8
    threads_batch: 4
    keep: 512
    cache_type_k: q8_0
    cache_type_v: q8_0
    grp_attn_n: 4

  "2":
    # Dual GPU: balanced performance
    tensor_split: "0.94,1"
    batch_size: 1024
    ubatch_size: 512
    threads: 16
    threads_batch: 8
    keep: 1024
    cache_type_k: q8_0
    cache_type_v: q8_0
    grp_attn_n: 8
    parallel: 2

  "4":
    # Quad GPU: higher throughput
    tensor_split: "0.94,0.97,0.97,1"
    batch_size: 2048
    ubatch_size: 1024
    threads: 16
    threads_batch: 8
    keep: 2048
    cache_type_k: q8_0
    cache_type_v: q8_0
    grp_attn_n: 12
    parallel: 4
    defrag_threshold: 0.1

  "7":
    # 7+ GPUs: maximum throughput configuration (169 GB VRAM available)
    # Note: batch_size and ubatch_size reduced to allow large KV caches
    # (fit will calibrate the actual ctx_seq available on the system)
    tensor_split: "0.94,1,1,1,1,1,0.94"
    batch_size: 2048
    ubatch_size: 1024
    threads: 16
    threads_batch: 8
    numa: distribute
    fit_target: 16384
    keep: 8192
    cache_type_k: q8_0
    cache_type_v: q8_0
    grp_attn_n: 16
    parallel: 4
    defrag_threshold: 0.05

speculative_defaults:
  # Global defaults for speculative/draft model variants.
  # Set `enabled` to true to enable installer/CLI creation of speculative entries.
  enabled: false
  # Prefix used when generating speculative model catalog IDs: "speculative-<base_id>"
  id_prefix: speculative-
  # Flags applied to speculative model server runs when autocontext is not available.
  # `fit` is emitted as a string to match existing flag style (on/off).
  fit: on
  # `fitt` default value (integer tokens) when `fit` is used.
  fitt: 1024
  # Allow multiple speculative variants per base model when true.
  allow_multiple_variants: true
